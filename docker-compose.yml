# Локальное окружение: docs/spec/01-architecture.md §7.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql.in:ro
      - ./infra/db/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ortaq
      MINIO_ROOT_PASSWORD: ortaq-local-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
