# Локальное окружение. Порты нестандартные, чтобы не конфликтовать с другими проектами.
name: ortaq

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ortaq
      POSTGRES_PASSWORD: ortaq
      POSTGRES_DB: ortaq
    ports: ["5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ortaq -d ortaq"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Почта в разработке: письма председателям видны на http://localhost:8035
  mailpit:
    image: axllent/mailpit:v1.24.1
    ports: ["1035:1025", "8035:8025"]

volumes:
  pgdata:
