name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        run: |
          for db in ortaq ortaq_test; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -v db=$db \
              -v migrator_pw=migrator -v app_rw_pw=app_rw -v app_admin_pw=app_admin \
              -f infra/db/bootstrap.sql
          done

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations are reversible
        working-directory: apps/api
        env:
          DATABASE_MIGRATOR_URL: postgresql://migrator:migrator@localhost:5432/ortaq
        run: node scripts/verify-migrations-reversible.mjs

      # Интеграционные тесты API включают тесты изоляции домов — блокирующая проверка (13-security §1).
      - run: pnpm test

      - name: Dependency audit (critical)
        run: pnpm audit --audit-level critical --prod

      - run: pnpm build
